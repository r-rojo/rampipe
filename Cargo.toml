[package]
name = "rampipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Memory-residency scheduler for keeping multiple LLMs mapped under a hard RAM ceiling"
repository = "https://github.com/r-rojo/rampipe"
readme = "README.md"
keywords = ["llm", "mmap", "gguf", "inference", "memory"]
categories = ["memory-management", "science"]

[dependencies]
llama-cpp-2 = { version = "0.1.154", optional = true }
llama-cpp-sys-2 = { version = "0.1.154", optional = true }
encoding_rs = { version = "0.8", optional = true }
minijinja = { version = "2", features = ["json"], optional = true }
# Registers Python-native string/dict methods (`.startswith()`, `.items()`,
# ...) minijinja's own from-scratch Jinja2 reimplementation doesn't
# replicate -- see `render_messages`'s own doc comment for the real, live
# chat template (Qwen 3.8's) this fixes: it calls `content.startswith(...)`,
# which Python's own Jinja2 silently supports by falling through to native
# Python str methods, but minijinja has no equivalent fallback without this.
minijinja-contrib = { version = "2", features = ["pycompat"], optional = true }
memmap2 = "0.9.11"
thiserror = "2.0.19"
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3.27.0"
hf-hub = { version = "1.0", features = ["blocking"] }
serde_yaml = "0.9"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
mach2 = "0.6.0"

[features]
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs", "dep:minijinja", "dep:minijinja-contrib"]
# GPU offload via llama.cpp's CUDA backend. Requires the CUDA toolkit
# (`nvcc`) on the build machine -- the driver alone (`nvidia-smi`
# working) is not enough, since this compiles GPU kernels at build
# time rather than just linking against a runtime.
cuda = ["llama", "llama-cpp-2/cuda"]
client = []

[[example]]
name = "residency_vs_ttft"
required-features = ["llama"]

[[example]]
name = "determinism_probe"
required-features = ["llama"]

[[example]]
name = "smoke_7b"
required-features = ["llama"]

[[example]]
name = "chat_smoke"
required-features = ["llama"]

[[example]]
name = "session_persistence_smoke"
required-features = ["llama"]

[[example]]
name = "grammar_smoke"
required-features = ["llama"]

[[example]]
name = "conversation_overflow_smoke"
required-features = ["llama"]

[[example]]
name = "rampiped_status_smoke"
required-features = ["client"]

[[example]]
name = "rampiped_generate_smoke"
required-features = ["client"]

[[example]]
name = "rampiped_grammar_smoke"
required-features = ["client"]

[[example]]
name = "rampiped_conversation_smoke"
required-features = ["client"]

[[example]]
name = "stress_test"
required-features = ["client"]

[[bin]]
name = "rampiped"
required-features = ["llama"]
