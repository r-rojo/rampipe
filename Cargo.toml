[package]
name = "rampipe"
version = "0.1.0"
edition = "2024"

[dependencies]
llama-cpp-2 = { version = "0.1.152", optional = true }
encoding_rs = { version = "0.8", optional = true }
minijinja = { version = "2", features = ["json"], optional = true }
memmap2 = "0.9.11"
thiserror = "2.0.19"
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
hf-hub = { version = "1.0", features = ["blocking"] }
anyhow = "1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
mach2 = "0.6.0"

[features]
llama = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:minijinja"]

[[example]]
name = "residency_vs_ttft"
required-features = ["llama"]

[[example]]
name = "smoke_7b"
required-features = ["llama"]

[[example]]
name = "determinism_probe"
required-features = ["llama"]
